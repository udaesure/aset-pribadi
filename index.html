<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 Dashboard Aset Pribadi</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',system-ui,sans-serif; }
  :root{
    --bg:#0f1220; --card:#1a1f35; --card2:#232a45; --accent:#6c8cff;
    --accent2:#8b5cf6; --success:#22c55e; --danger:#ef4444; --warn:#f59e0b;
    --text:#e8ecf5; --muted:#8b93ab; --border:#2a3152;
  }
  body{ background:var(--bg); color:var(--text); min-height:100vh; padding:20px; }
  .container{ max-width:1200px; margin:0 auto; }

  header{
    background:linear-gradient(135deg,var(--accent),var(--accent2));
    padding:24px; border-radius:16px; margin-bottom:20px;
    box-shadow:0 10px 30px rgba(108,140,255,.25);
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:12px;
  }
  header h1{ font-size:1.6rem; }
  header p{ opacity:.9; font-size:.85rem; margin-top:4px; }

  .status-badge{
    display:inline-flex; align-items:center; gap:6px;
    padding:6px 12px; border-radius:20px; font-size:.75rem; font-weight:600;
    background:rgba(255,255,255,.2);
  }
  .status-dot{ width:8px; height:8px; border-radius:50%; background:#f59e0b; }
  .status-dot.online{ background:#22c55e; }
  .status-dot.offline{ background:#ef4444; }

  .summary{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; margin-bottom:20px; }
  .sum-card{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:18px; position:relative; overflow:hidden;
    transition:transform .2s;
  }
  .sum-card:hover{ transform:translateY(-3px); }
  .sum-card::before{ content:''; position:absolute; top:0; left:0; width:4px; height:100%; }
  .sum-card.s1::before{ background:var(--accent); }
  .sum-card.s2::before{ background:var(--warn); }
  .sum-card.s3::before{ background:var(--success); }
  .sum-card .label{ font-size:.75rem; color:var(--muted); text-transform:uppercase; letter-spacing:1px; }
  .sum-card .value{ font-size:1.4rem; font-weight:700; margin-top:6px; }
  .sum-card .sub{ font-size:.75rem; color:var(--muted); margin-top:4px; }

  .section{
    background:var(--card); border:1px solid var(--border); border-radius:14px;
    padding:20px; margin-bottom:16px;
  }
  .section h2{
    font-size:1rem; margin-bottom:14px; display:flex; align-items:center; gap:8px;
    color:var(--accent);
  }
  .section h2 span{ font-size:1.2rem; }

  .grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
  .field{ display:flex; flex-direction:column; gap:4px; }
  .field label{ font-size:.75rem; color:var(--muted); }
  .field input{
    background:var(--card2); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; color:var(--text); font-size:.9rem; outline:none;
    transition:border .2s;
  }
  .field input:focus{ border-color:var(--accent); }
  .field input[type="date"]{ color-scheme:dark; }

  .row-item{ display:grid; grid-template-columns:1fr 1fr 40px; gap:8px; margin-bottom:8px; align-items:end; }
  .row-item input{ width:100%; background:var(--card2); border:1px solid var(--border); border-radius:8px; padding:10px; color:var(--text); }
  .btn-del{
    background:var(--danger); border:none; color:white; border-radius:8px;
    width:40px; height:42px; cursor:pointer; font-size:1.1rem;
  }
  .btn-add{
    background:var(--card2); border:1px dashed var(--border); color:var(--muted);
    padding:10px; border-radius:8px; cursor:pointer; width:100%; margin-top:6px;
    transition:.2s;
  }
  .btn-add:hover{ color:var(--accent); border-color:var(--accent); }

  .actions{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .btn{
    padding:12px 20px; border:none; border-radius:10px; cursor:pointer;
    font-weight:600; font-size:.9rem; transition:.2s; display:flex; align-items:center; gap:6px;
  }
  .btn-primary{ background:linear-gradient(135deg,var(--accent),var(--accent2)); color:white; }
  .btn-primary:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(108,140,255,.35); }
  .btn-secondary{ background:var(--card2); color:var(--text); border:1px solid var(--border); }
  .btn-secondary:hover{ border-color:var(--accent); }
  .btn-danger{ background:var(--danger); color:white; }

  .history{ max-height:400px; overflow-y:auto; }
  .hist-item{
    background:var(--card2); border-left:3px solid var(--accent);
    border-radius:8px; padding:12px; margin-bottom:8px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px;
    font-size:.85rem;
  }
  .hist-item .date{ color:var(--muted); font-size:.75rem; }
  .hist-item .val{ font-weight:700; color:var(--success); }
  .hist-item .actions-hist{ display:flex; gap:6px; }
  .hist-item button{
    background:transparent; border:1px solid var(--border); color:var(--muted);
    border-radius:6px; padding:4px 8px; cursor:pointer; font-size:.75rem;
  }
  .hist-item button:hover{ color:var(--accent); border-color:var(--accent); }

  .toast{
    position:fixed; bottom:30px; right:30px; background:var(--success);
    color:white; padding:14px 22px; border-radius:10px;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    transform:translateY(100px); opacity:0; transition:.3s; z-index:9999;
  }
  .toast.show{ transform:translateY(0); opacity:1; }
  .toast.error{ background:var(--danger); }
  .toast.info{ background:var(--accent); }

  .empty{ text-align:center; color:var(--muted); padding:20px; font-size:.85rem; }

  @media print{
    body{ background:white; color:black; }
    .actions, .btn-add, .btn-del, .history, header p{ display:none; }
    .section, .sum-card{ border:1px solid #ccc; background:white; color:black; }
    .field input{ background:white; color:black; border:1px solid #ccc; }
  }
</style>
</head>
